name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Verify release tag
      if: ${{ inputs.release_tag != '' }}
      run: |
        # A release must be built from the commit its tag names, so the tag identifies the source.
        TAG_COMMIT=$(git rev-parse "refs/tags/${{ inputs.release_tag }}^{commit}")
        test "$(git rev-parse HEAD)" = "$TAG_COMMIT"

    - name: Setup Go
      if: ${{ inputs.release_tag != '' }}
      uses: actions/setup-go@v7
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache: false

    - name: Create corresponding source archive
      if: ${{ inputs.release_tag != '' }}
      run: |
        # Tracked files of this repository and all submodules, plus the Go module sources compiled
        # into libv2ray.aar. Created before any build step modifies the working tree.
        NAME="zapl-lab-vpn-${{ inputs.release_tag }}-source"
        # Excluded, not used by the Android build: the proprietary Windows wintun binaries in
        # hev-socks5-tunnel and the stale geo data files kept in AndroidLibXrayLite.
        git ls-files --recurse-submodules \
          | grep -v -E '^hev-socks5-tunnel/third-part/wintun/|^AndroidLibXrayLite/assets/' \
          > "$RUNNER_TEMP/source-files.txt"
        (cd AndroidLibXrayLite && go mod vendor)
        find AndroidLibXrayLite/vendor -type f >> "$RUNNER_TEMP/source-files.txt"
        mkdir -p source-archive
        tar --create --gzip --file "source-archive/$NAME.tar.gz" \
          --transform "s,^,$NAME/," --files-from "$RUNNER_TEMP/source-files.txt"
        rm -rf AndroidLibXrayLite/vendor

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licensePlaystoreReleaseReport licenseFdroidReleaseReport
        python3 ${{ github.workspace }}/scripts/check_licenses.py ${{ inputs.release_tag != '' && '--release' || '' }} \
          app/build/reports/licenses/licensePlaystoreReleaseReport.json \
          app/build/reports/licenses/licenseFdroidReleaseReport.json
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
    
    - name: Write build info
      run: |
        # Records what the APKs were built from; published next to them in a release.
        cd ${{ github.workspace }}
        {
          echo "tag: ${{ inputs.release_tag }}"
          echo "commit: $(git rev-parse HEAD)"
          grep -E '^\s*(applicationId|versionCode|versionName) = ' V2rayNG/app/build.gradle.kts | sed 's/^ *//'
          echo "AndroidLibXrayLite: $(git -C AndroidLibXrayLite describe --tags --always) $(git -C AndroidLibXrayLite rev-parse HEAD)"
          echo "libv2ray.aar sha256: $(sha256sum V2rayNG/app/libs/libv2ray.aar | cut -d' ' -f1)"
          echo "hev-socks5-tunnel: $(git -C hev-socks5-tunnel describe --tags --always) $(git -C hev-socks5-tunnel rev-parse HEAD)"
          echo "NDK: $NDK_HOME"
          grep -E '^(agp|kotlin|desugarJdkLibs) = ' V2rayNG/gradle/libs.versions.toml
          grep -E 'compileSdk|targetSdk|minSdk' V2rayNG/app/build.gradle.kts | sed 's/^ *//'
          (cd V2rayNG && ./gradlew --version) | grep -E '^(Gradle|Kotlin|Launcher JVM|OS)'
          echo "runner: $ImageOS $ImageVersion"
          echo "APK sha256:"
          find V2rayNG/app/build/outputs/apk -name '*.apk' -path '*release*' -exec sha256sum {} \; | sed 's,  .*/,  ,'
        } > build-info.txt
        cat build-info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v7
      with:
        name: build-info
        path: ${{ github.workspace }}/build-info.txt

    - name: Upload source archive
      if: ${{ inputs.release_tag != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: source
        path: ${{ github.workspace }}/source-archive/*.tar.gz

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f \( -name '*.apk' -o -name '*-source.tar.gz' -o -name 'build-info.txt' \) | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/zapl-lab-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
